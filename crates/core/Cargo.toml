[package]
name = "mcptools_core"
version = "0.0.0"
homepage = "https://github.com/cloudbridgeuy/mcptools"
description = "Core for the mcptools project"
autobins = false

authors.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "mcptools_core"
path = "src/lib.rs"

[dependencies]
base64 = { workspace = true }
reqwest = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
html-escape = { workspace = true }
chrono = { workspace = true }
html2md = { workspace = true }
scraper = { workspace = true }
md5 = "0.7"
thiserror = { workspace = true }
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"] }
urlencoding = { workspace = true }
pulldown-cmark = { version = "=0.13.5", default-features = false, features = ["html"] }
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "default-themes", "html", "regex-fancy"] }

[dev-dependencies]
tempfile = "3.8"

[lints]
workspace = true
